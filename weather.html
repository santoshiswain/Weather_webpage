<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>weather App</title>
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"  />
  <link href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="weather.css" rel="stylesheet">
</head>
<body>

    <div class="container">

        <div class="weather-card">

            <h1>Weather App</h1>
            <p>Check the weather in your city</p>
            <div class="search">
          <input
                    type="text"
                    id="city"
                    placeholder="Enter city name"
          >

                <button class="a">
                    <i class="fa-solid fa-magnifying-glass"></i>
                                   </button>
            </div>

            <div class="weather">

                <img src="clear.png" id="icon">

           <h1 id="result">25°C</h1>

                <h2 id="city-name">Weather</h2>

                <div class="details">

            <div class="humidity">
                        <img src="humidity.png">
                        <div>
                            <h3 id="sita">40%</h3>
                            <p>Humidity</p>
                        </div>
            </div>

                    <div class="wind">
           <img src="wind.png">
                        <div>
                            <h3 id="ram">10 km/hr</h3>
            <p>Wind Speed</p>
                        </div>
                    </div>

                </div>

            </div>
            <div class="forecast-section">

    <h2>5-Day Forecast</h2>

    <div class="forecast-container" id="forecast">

        <!-- Forecast cards will appear here -->

    </div>

</div>

        </div>

    </div>

    <script src="weather.js"></script>

</body>
</html>
